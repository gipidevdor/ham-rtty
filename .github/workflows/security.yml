name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpan-audit:
    name: CVEs / Perl and installed CPAN dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@84c44b5a14f12b311f1bf3d2a70c8807f30b7ab2 # v1
        with:
          perl-version: '5.44'
      - name: Install full dependency set and current advisory database
        run: |
          cpanm --notest --installdeps --with-develop --with-recommends .
          cpanm --notest CPAN::Audit CPANSA::DB Module::CPANfile PPI PDL 'Pod::Man~v6.1.1'
          perl Makefile.PL
          make
      - name: Record scanner, backend and database versions
        run: |
          cpan-audit --version
          perl -MPDL -MCPANSA::DB -e 'print "PDL $PDL::VERSION; CPANSA::DB $CPANSA::DB::VERSION\n"'
      - name: Generate supported dependency metadata
        run: |
          mkdir -p "$RUNNER_TEMP/declared-audit"
          perl -MCPAN::Meta -MModule::CPANfile -e 'my $meta = CPAN::Meta->load_file("MYMETA.json"); print Module::CPANfile->from_prereqs($meta->prereqs)->to_string' > "$RUNNER_TEMP/declared-audit/cpanfile"
          test -s "$RUNNER_TEMP/declared-audit/cpanfile"
      - name: Audit installed dependencies and interpreter
        run: perl maint/audit-dependencies.pl installed > "$RUNNER_TEMP/cpan-audit-installed.json"
      - name: Audit declared dependency constraints
        if: ${{ !cancelled() }}
        run: perl maint/audit-dependencies.pl declared MYMETA.json "$RUNNER_TEMP/declared-audit" > "$RUNNER_TEMP/cpan-audit-declared.json"
      - name: Save CVE evidence even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpan-security-audit
          path: |
            ${{ runner.temp }}/cpan-audit-*.json
            ${{ runner.temp }}/declared-audit/cpanfile
          if-no-files-found: error
          retention-days: 14
  secrets:
    name: Secrets / complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history with redacted evidence
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
      - name: Save redacted secret scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrets-audit-redacted
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: error
          retention-days: 7
  workflows:
    name: Workflow security and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned workflow analyzers
        run: |
          python3 -m venv "$RUNNER_TEMP/security-tools"
          "$RUNNER_TEMP/security-tools/bin/pip" install 'zizmor==1.31.1'
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check workflow expressions, syntax and shell commands
        run: '"$(go env GOPATH)/bin/actionlint" -color'
      - name: Check tokens, permissions, injection and action pinning
        run: '"$RUNNER_TEMP/security-tools/bin/zizmor" --offline --no-progress .github'
  perl-security:
    name: Perl unsafe constructs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@84c44b5a14f12b311f1bf3d2a70c8807f30b7ab2 # v1
        with:
          perl-version: '5.44'
      - name: Install Perl analyzer
        run: cpanm --notest Perl::Critic
      - name: Reject unsafe eval, file opens, handles and shell execution
        run: |
          for policy in ProhibitStringyEval ProhibitTwoArgOpen ProhibitBarewordFileHandles ProhibitBacktickOperators; do
            perlcritic --single-policy "$policy" lib maint examples Makefile.PL
          done
  security:
    name: Security checks
    if: ${{ always() }}
    needs: [cpan-audit, secrets, workflows, perl-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every security check to pass
        env:
          CVE_RESULT: ${{ needs.cpan-audit.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          PERL_RESULT: ${{ needs.perl-security.result }}
        run: |
          for result in "$CVE_RESULT" "$SECRETS_RESULT" "$WORKFLOWS_RESULT" "$PERL_RESULT"; do
            test "$result" = success || exit 1
          done
